name: Build and Test

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'examples/nodesets/**'
      - '.github/workflows/build-test.yml'
      - '.github/actions/drop-stale-caches/**'
      - '.github/linux/**'
      - 'tools/package_version.sh'
      - 'tools/check_glibc_floor.sh'
      - '!**/*.md'

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build-test:
    name: Build and Test (${{ matrix.os }}, Qt ${{ matrix.qt }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt: '6.9.3'
            cmake_extra: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache'

          - os: windows-latest
            qt: '6.9.3'
            # Installed into <Qt root>/Tools/OpenSSLv3, where the QUaServer build finds it on its own
            qt_tools: 'tools_opensslv3_x64'

          - os: macos-latest
            qt: '6.9.3'
            # Clang embeds header mtimes in PCH files, invalidating the cache after a fresh checkout.
            cmake_extra: '-DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache "-DCMAKE_CXX_FLAGS=-Xclang -fno-pch-timestamp"'

    env:
      CCACHE_SLOPPINESS: pch_defines,time_macros,include_file_mtime,include_file_ctime

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # MSVC is left out: ccache does not cache its precompiled-header compiles.
      - name: Set up ccache
        if: runner.os != 'Windows'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: build-test-${{ matrix.os }}-${{ matrix.qt }}
          max-size: 1G
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build patchelf libssl-dev libgl1-mesa-dev libegl1 libxkbcommon-dev libfontconfig1

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install ninja openssl@3
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt }}
          tools: ${{ matrix.qt_tools }}
          cache: true

      - name: Configure
        run: >
          cmake -S src -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOUASIM_BUILD_TESTS=ON
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure --parallel -L ouasim

      # ccache-action saves the replacement entry in its post-job step.
      - name: Drop superseded ccache entries
        if: runner.os != 'Windows' && github.event_name == 'push'
        uses: ./.github/actions/drop-stale-caches
        with:
          prefix: ccache-build-test-${{ matrix.os }}-${{ matrix.qt }}-
