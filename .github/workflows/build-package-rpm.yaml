name: Build RPM package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: package-rpm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  QT_VERSION: '6.9.3'
  QT_TOOLS: tools_opensslv3_src
  MAINTAINER: Alexandr Ananev <mail@ananev.org>
  DEBIAN_FRONTEND: noninteractive

jobs:
  rpm:
    name: Build .rpm version '${{ github.ref_name }}'
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    timeout-minutes: 90

    outputs:
      arch: ${{ steps.package.outputs.arch }}
      name: ${{ steps.package.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Install checkout dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git sudo unzip xz-utils zstd

      - name: Checkout
        uses: actions/checkout@v5

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Set up Python
        uses: ./.github/actions/setup-python

      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential perl pkg-config \
            rpm file \
            desktop-file-utils appstream-util \
            libgl1-mesa-dev \
            libgtk-3-0 libwayland-cursor0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libxcb-util1 libxkbcommon-x11-0
          python3 -m pip install --upgrade 'cmake>=3.22,<4' ninja patchelf
          cmake --version
          ninja --version
          patchelf --version

      - name: Determine version
        id: version
        uses: ./.github/actions/project-version

      - name: Determine package name
        id: package
        run: |
          arch="$(uname -m)"
          package="ouasim-${{ steps.version.outputs.rpmVersion }}-${{ steps.version.outputs.rpmRelease }}.$arch.rpm"

          {
            echo "arch=$arch"
            echo "name=$package"
          } >> "$GITHUB_OUTPUT"
          echo "Building $package"

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          tools: ${{ env.QT_TOOLS }}
          setup-python: false

      - name: Set up OpenSSL
        uses: ./.github/actions/setup-openssl

      - name: Configure
        run: >
          cmake -S src -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOUASIM_BUILD_TESTS=OFF
          -DOUASIM_DEPLOY_RUNTIME=ON
          "-DOPENSSL_ROOT_DIR=$OPENSSL_ROOT_DIR"
          "-DPROJECT_PRERELEASE=${{ steps.version.outputs.prerelease }}"

      - name: Build
        run: cmake --build build --parallel --target ouasim

      - name: Stage package root
        run: |
          rm -rf pkgroot
          bash .github/linux/bundle.sh \
            "$PWD/pkgroot" \
            "$PWD/build/app/ouasim" \
            "$QT_ROOT_DIR" \
            "$OPENSSL_ROOT_DIR"

          DESTDIR="$PWD/pkgroot" cmake --install build --prefix /usr --component licenses

          cp -r .github/linux/usr/. pkgroot/usr/
          install -D -m 0644 src/app/res/icons/app.svg \
            pkgroot/usr/share/icons/hicolor/scalable/apps/io.github.sanny32.OpenUaSim.svg

          metainfo=pkgroot/usr/share/metainfo/io.github.sanny32.OpenUaSim.metainfo.xml
          mkdir -p "$(dirname "$metainfo")"
          sed -e "s|@VERSION@|${{ steps.version.outputs.appVersion }}|" \
              -e "s|@RELEASE_DATE@|${{ steps.version.outputs.releaseDate }}|" \
              .github/linux/metainfo/io.github.sanny32.OpenUaSim.metainfo.xml.in \
              > "$metainfo"
          chmod 0644 "$metainfo"

          find pkgroot -type d -exec chmod 0755 {} +

      - name: Check the glibc floor
        uses: ./.github/actions/check-glibc-floor
        with:
          path: pkgroot/usr/lib/ouasim

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate pkgroot/usr/share/applications/*.desktop
          appstream-util validate-relax --nonet pkgroot/usr/share/metainfo/*.metainfo.xml

      - name: Generate spec file
        shell: bash
        run: |
          mkdir -p rpmbuild/SPECS

          sonames=''
          for lib in pkgroot/usr/lib/ouasim/lib/*; do
            name="${lib##*/}"
            sonames="${sonames:+$sonames|}${name//./[.]}"
          done
          if [ -z "$sonames" ]; then
            echo "::error::No bundled libraries found; the staged tree is wrong"
            exit 1
          fi
          requires_exclude="^(${sonames})[(]"

          find pkgroot/usr/lib/ouasim -type f \( -name '*.so*' -o -name ouasim \) \
            -exec patchelf --print-needed {} + \
            | sort -u \
            | while read -r soname; do
                [ -e "pkgroot/usr/lib/ouasim/lib/$soname" ] && continue
                echo "Requires:       ${soname}()(64bit)"
              done > rpmbuild/requires

          if [ ! -s rpmbuild/requires ]; then
            echo "::error::The bundle needs nothing from the distribution; that is wrong"
            exit 1
          fi
          cat rpmbuild/requires

          sed -e "s#@NAME@#ouasim#" \
              -e "s#@VERSION@#${{ steps.version.outputs.rpmVersion }}#" \
              -e "s#@RELEASE@#${{ steps.version.outputs.rpmRelease }}#" \
              -e "s#@REQUIRES_EXCLUDE@#${requires_exclude}#" \
              -e "/@REQUIRES@/r rpmbuild/requires" \
              -e "/@REQUIRES@/d" \
              .github/linux/rpm/ouasim.spec.in > rpmbuild/SPECS/ouasim.spec

          cat >> rpmbuild/SPECS/ouasim.spec <<EOF
          * $(date -u +'%a %b %d %Y') ${{ env.MAINTAINER }} - ${{ steps.version.outputs.rpmVersion }}-${{ steps.version.outputs.rpmRelease }}
          - Automated build of ${{ github.sha }}.
          EOF

          cat rpmbuild/SPECS/ouasim.spec

      - name: Build package
        run: |
          rpmbuild -bb rpmbuild/SPECS/ouasim.spec \
            --define "_topdir $PWD/rpmbuild" \
            --define "_stagedir $PWD/pkgroot"

          mv "rpmbuild/RPMS/${{ steps.package.outputs.arch }}/${{ steps.package.outputs.name }}" .

      - name: Inspect package
        run: |
          rpm -qpi "${{ steps.package.outputs.name }}"
          rpm -qpl "${{ steps.package.outputs.name }}" | tee rpm-contents.txt
          for file in LICENSE THIRD_PARTY_NOTICES.md; do
            grep -Fx "/usr/share/licenses/ouasim/$file" rpm-contents.txt
          done
          for file in licenses/*; do
            grep -Fx "/usr/share/licenses/ouasim/third-party/$(basename "$file")" \
              rpm-contents.txt
          done

          echo '--- provides ---'
          rpm -qp --provides "${{ steps.package.outputs.name }}"
          echo '--- requires ---'
          rpm -qp --requires "${{ steps.package.outputs.name }}"

          rpm -qp --requires "${{ steps.package.outputs.name }}" \
            | grep -Fx 'libxcb-cursor.so.0()(64bit)'

          if rpm -qp --provides "${{ steps.package.outputs.name }}" | grep -E '^lib(Qt6|open62541|ssl|crypto)'; then
            echo "::error::The bundled libraries are offered as provides"
            exit 1
          fi
          if rpm -qp --requires "${{ steps.package.outputs.name }}" | grep -E '^lib(Qt6|open62541|ssl|crypto)'; then
            echo "::error::The bundled libraries are requested as requires"
            exit 1
          fi

      - name: Compute checksum
        run: sha256sum "${{ steps.package.outputs.name }}" > "${{ steps.package.outputs.name }}.sha256"

      - name: Upload package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ouasim-rpm-${{ steps.package.outputs.arch }}
          path: |
            ${{ steps.package.outputs.name }}
            ${{ steps.package.outputs.name }}.sha256
          if-no-files-found: error

  verify:
    name: Verify .rpm
    runs-on: ubuntu-latest
    needs: rpm
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download package artifact
        uses: actions/download-artifact@v8
        with:
          name: ouasim-rpm-${{ needs.rpm.outputs.arch }}

      - name: Trust RED SOFT registry
        uses: ./.github/actions/trust-redsoft-registry

      - name: Verify the package installs
        uses: ./.github/actions/verify-linux-package
        with:
          package: ${{ needs.rpm.outputs.name }}
          package-manager: rpm
          images: >-
            fedora:43
            fedora:44
            rockylinux/rockylinux:10.1
            registry.red-soft.ru/redos8c/ubi:latest
            opensuse/tumbleweed
            alt:p11

      - name: Attach package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          prerelease: ${{ needs.rpm.outputs.prerelease != '' }}
          files: |
            ${{ needs.rpm.outputs.name }}
            ${{ needs.rpm.outputs.name }}.sha256
          generate_release_notes: true
          fail_on_unmatched_files: true
